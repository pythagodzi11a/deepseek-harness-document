name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily: pick up upstream documentation changes.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go (Hugo modules)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Checkout upstream docs
        run: |
          # Full shallow clone: published pages link into arbitrary repository
          # paths (apps/, packages/, scripts/, ...), and the projector rejects
          # missing link targets, so sparse checkouts cannot be used.
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git upstream
          echo "Upstream revision: $(git -C upstream rev-parse HEAD)"

      - name: Generate site content
        env:
          UPSTREAM_DIR: ${{ github.workspace }}/upstream
        run: pnpm run generate

      - name: Build site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
        run: |
          BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Base URL: ${BASE_URL}"
          hugo --cleanDestinationDir --minify --baseURL "${BASE_URL}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
